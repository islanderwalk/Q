global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Accept samples up to 7 days older than the newest one: backfill.py writes old minutes into series that are still live.
storage:
  tsdb:
    out_of_order_time_window: 7d

scrape_configs:
  - job_name: pushgateway
    honor_labels: true          # keep the job/instance/op labels pushed by the probe
    static_configs:
      - targets: ["pushgateway:9091"]
