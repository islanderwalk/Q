# Q6 真實環境：官方映像為主，GCP 託管服務在本機以官方模擬器或同介面替身代替（對照表見 README.md）。
# 啟動：./run.sh up（先建字典 artifact、外掛、映像）；所有資料放 runtime/（不進 git）。
name: qsearch-q6
x-seg: &seg
  image: qsearch-seg:local
  build: { context: .., dockerfile: realenv/seg/Dockerfile, network: host, args: { SEG_BUILD: "${SEG_BUILD:-local}" } }
  environment: &segenv
    ES_URL: http://es:9200
    DICT_BASE_URL: http://dictsrv
    PUBSUB_EMULATOR_HOST: pubsub:8085
    PUBSUB_PROJECT: qsearch-local
    PG_DSN: postgresql://qsearch:qsearch@pg:5432/qsearch
    RAW_ROOT: /data/raw
  depends_on: { es: { condition: service_healthy }, dictsrv: { condition: service_started } }
  volumes: [ "./runtime/raw:/data/raw:ro" ]

services:
  dictsrv:            # 字典 artifact（GCS bucket 的本機替身；nginx 回 Last-Modified／ETag，IK 靠這兩個標頭判斷要不要重載）
    image: mirror.gcr.io/library/nginx:1.27-alpine
    volumes: [ "./runtime/dictsrv:/usr/share/nginx/html:ro" ]
    ports: [ "8081:80" ]

  es:                 # 官方 Elasticsearch 9.5.5 ＋ smartcn、ICU、IK（GCP 設計：Compute Engine VM，上面裝 Ops Agent）
    image: qsearch-es:9.5.5
    build: { context: ./es, network: host }
    environment:
      - cluster.name=qsearch-q6
      - node.name=es-1
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 容器的磁碟是按 session 配額，ES 依「總容量的百分比」算水位會誤判已滿；改用絕對剩餘空間
      - cluster.routing.allocation.disk.watermark.low=4gb
      - cluster.routing.allocation.disk.watermark.high=2gb
      - cluster.routing.allocation.disk.watermark.flood_stage=1gb
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-4g} -Xmx${ES_HEAP:-4g}
    volumes: [ "esdata:/usr/share/elasticsearch/data" ]
    ports: [ "9200:9200" ]
    depends_on: [ dictsrv ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      retries: 30

  kibana:             # 官方 Kibana 9.5.5（Discover、Index Management、Dev Tools、Tag cloud）
    image: mirror.gcr.io/library/kibana:9.5.5
    environment: [ "ELASTICSEARCH_HOSTS=http://es:9200", "NODE_OPTIONS=--max-old-space-size=1024", "TELEMETRY_OPTIN=false" ]
    ports: [ "5601:5601" ]
    depends_on: { es: { condition: service_healthy } }

  pubsub:             # Google 官方 Pub/Sub 模擬器（gcloud beta emulators pubsub）；客戶端程式碼與連真 GCP 相同
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: [ "gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=qsearch-local" ]
    ports: [ "8085:8085" ]

  pg:                 # 官方 PostgreSQL 16：回補帳本／checkpoint、字典發版、影子比對；另放一份詞表做 ES 對照
    image: mirror.gcr.io/library/postgres:16
    environment: [ "POSTGRES_USER=qsearch", "POSTGRES_PASSWORD=qsearch", "POSTGRES_DB=qsearch" ]
    volumes: [ "./pg/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro", "pgdata:/var/lib/postgresql/data" ]
    ports: [ "55433:5432" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U qsearch"], interval: 5s, retries: 30 }

  seg-v2:             # 串流斷詞服務 v2（Cloud Run 服務）：訂閱 parsed-posts-seg-v2
    <<: *seg
    command: [ "service" ]
    environment: { <<: *segenv, PIPELINE: v2, PUBSUB_SUBSCRIPTION: parsed-posts-seg-v2, DICT_VERSION: "${DICT_VERSION_V2:-qsearch-q6-2026.10.30.2}", METRICS_PORT: "9108" }

  seg-v1:             # 串流斷詞服務 v1（舊流程並行，A/B 期間各寫各的欄位）
    <<: *seg
    command: [ "service" ]
    environment: { <<: *segenv, PIPELINE: v1, PUBSUB_SUBSCRIPTION: parsed-posts-seg-v1, DICT_VERSION: qsearch-q6-2026.10.30.1, METRICS_PORT: "9108" }

  seg-job:            # 回補 Job（Cloud Run Jobs）：與串流服務同一個映像，只是啟動參數不同
    <<: *seg
    profiles: [ "job" ]
    command: [ "job" ]
    environment: { <<: *segenv, PIPELINE: v2, DICT_VERSION: "${DICT_VERSION_V2:-qsearch-q6-2026.10.30.2}" }
    depends_on: { es: { condition: service_healthy }, pg: { condition: service_healthy } }

  api:                # 文字雲 API ＋ PM A/B 前端（Cloud Run 服務）
    image: qsearch-wordcloud-api:local
    build: { context: ., dockerfile: api/Dockerfile, network: host }
    environment: [ "ES_URL=http://es:9200", "DICT_BASE_URL=http://dictsrv" ]
    ports: [ "8080:8080" ]
    depends_on: { es: { condition: service_healthy } }

  otelcol:            # OpenTelemetry Collector：elasticsearch／postgresql receiver（Ops Agent 內部用的同一組 receiver）
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes: [ "./monitoring/otelcol.yaml:/etc/otelcol/config.yaml:ro" ]
    ports: [ "8889:8889" ]
    depends_on: { es: { condition: service_healthy }, pg: { condition: service_healthy } }

  prometheus:         # GCP 上對應 Managed Service for Prometheus／Cloud Monitoring
    image: quay.io/prometheus/prometheus:v3.5.0
    volumes: [ "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro" ]
    ports: [ "9090:9090" ]

  grafana:
    image: grafana/grafana:12.1.1
    environment: [ "GF_AUTH_ANONYMOUS_ENABLED=true", "GF_AUTH_ANONYMOUS_ORG_ROLE=Admin", "GF_AUTH_DISABLE_LOGIN_FORM=true", "GF_DEFAULT_LOCALE=zh-Hant" ]
    volumes: [ "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" ]
    ports: [ "3000:3000" ]
    depends_on: [ prometheus, pg ]

volumes: { esdata: {}, pgdata: {} }
