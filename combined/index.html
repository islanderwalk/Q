<meta charset="utf-8">
<title>QSearch Q1–Q6 互動版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：頂部一條固定 tab 列，下方整塊 iframe 顯示該題的原始互動頁（各頁獨立，不互相干擾樣式） */
:root {
  --bg: #f6f7f9;
  --bar: #ffffff;
  --ink: #18202c;
  --muted: #5d6878;
  --line: #d9dee6;
  --accent: #1f5fa8;
  --accent-ink: #ffffff;
  --hover: #eaf0f8;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --bar: #171c24; --ink: #e6eaf0; --muted: #9aa5b4; --line: #2c3440;
    --accent: #7fb2ee; --accent-ink: #0d1623; --hover: #1e2835; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --bar: #171c24; --ink: #e6eaf0; --muted: #9aa5b4; --line: #2c3440;
  --accent: #7fb2ee; --accent-ink: #0d1623; --hover: #1e2835; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  flex: none; background: var(--bar); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex; align-items: center; gap: 16px; min-width: 0;
}
.brand { flex: none; font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-family: var(--font-mono); font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
[role="tablist"] {
  flex: 1; min-width: 0; display: flex; gap: 4px;
  overflow-x: auto; scrollbar-width: thin;
}
[role="tab"] {
  flex: none; display: flex; align-items: baseline; gap: 8px;
  border: 1px solid transparent; background: transparent; color: var(--ink);
  font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
[role="tab"] b { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
[role="tab"] span { color: var(--muted); font-size: 13px; }
[role="tab"]:hover { background: var(--hover); }
[role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[role="tab"][aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
[role="tab"][aria-selected="true"] span { color: var(--accent-ink); opacity: .85; }
.open {
  flex: none; color: var(--muted); font-size: 13px; text-decoration: none; white-space: nowrap;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
}
.open:hover { color: var(--ink); border-color: var(--muted); }
.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; min-height: 0; position: relative; }
main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
@media (max-width: 1100px) {
  [role="tab"]:not([aria-selected="true"]) span { display: none; }
}
@media (max-width: 760px) {
  .brand small, [role="tab"] span, .open { display: none; }
  header { gap: 10px; }
}
</style>

<header>
  <div class="brand">QSearch<small>Q1–Q6</small></div>
  <div role="tablist" aria-label="題目" id="tabs"></div>
  <a class="open" id="open" href="q1/index.html" target="_blank" rel="noopener">單獨開啟 ↗</a>
</header>
<main id="panes"></main>

<script>
const PAGES = [
  { id: "q1", label: "Q1", name: "顧客反饋整理", src: "q1/index.html" },
  { id: "q2", label: "Q2", name: "Postgres 貼文表解剖", src: "q2/index.html" },
  { id: "q3", label: "Q3", name: "PTT 全文搜尋 ETL 架構", src: "q3/architecture/src/index.html" },
  { id: "q4", label: "Q4", name: "Threads 爬蟲", src: "q4/index.html" },
  { id: "q5", label: "Q5", name: "新指標上線", src: "q5/index.html" },
  { id: "q6", label: "Q6", name: "回補整合圖", src: "q6/index.html" },
];
const tabs = document.getElementById("tabs");
const panes = document.getElementById("panes");
const openLink = document.getElementById("open");
const frames = {};

PAGES.forEach((p) => {
  const t = document.createElement("button");
  t.type = "button";
  t.id = "tab-" + p.id;
  t.setAttribute("role", "tab");
  t.setAttribute("aria-controls", "pane-" + p.id);
  t.setAttribute("aria-selected", "false");
  t.tabIndex = -1;
  t.innerHTML = `<b>${p.label}</b><span>${p.name}</span>`;
  t.title = `${p.label} ${p.name}`;
  t.addEventListener("click", () => { location.hash = p.id; });
  tabs.appendChild(t);
});

function show(id) {
  const p = PAGES.find((x) => x.id === id) || PAGES[0];
  if (!frames[p.id]) {
    const f = document.createElement("iframe");
    f.id = "pane-" + p.id;
    f.setAttribute("role", "tabpanel");
    f.setAttribute("aria-labelledby", "tab-" + p.id);
    f.title = `${p.label} ${p.name}`;
    f.src = p.src;
    panes.appendChild(f);
    frames[p.id] = f;
  }
  PAGES.forEach((x) => {
    const on = x.id === p.id;
    const t = document.getElementById("tab-" + x.id);
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
    if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (frames[x.id]) frames[x.id].hidden = !on;
  });
  openLink.href = p.src;
  document.title = `${p.label} ${p.name}｜QSearch Q1–Q6 互動版`;
}

tabs.addEventListener("keydown", (e) => {
  const i = PAGES.findIndex((x) => document.getElementById("tab-" + x.id) === document.activeElement);
  if (i < 0) return;
  let j = null;
  if (e.key === "ArrowRight") j = (i + 1) % PAGES.length;
  else if (e.key === "ArrowLeft") j = (i - 1 + PAGES.length) % PAGES.length;
  else if (e.key === "Home") j = 0;
  else if (e.key === "End") j = PAGES.length - 1;
  if (j === null) return;
  e.preventDefault();
  location.hash = PAGES[j].id;
  document.getElementById("tab-" + PAGES[j].id).focus();
});

const current = () => (location.hash || "").slice(1);
window.addEventListener("hashchange", () => show(current()));
show(current());
</script>
