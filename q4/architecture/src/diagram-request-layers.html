<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{font-family:'WenQuanYi Zen Hei','Noto Sans CJK TC',sans-serif;}
  .title{font-size:25px;font-weight:700;fill:#0f172a;}
  .subtitle{font-size:14px;fill:#475569;}
  .colh{font-size:13px;font-weight:700;fill:#94a3b8;letter-spacing:1px;}
  .lnum{font-size:17px;font-weight:700;}
  .lname{font-size:14px;font-weight:700;}
  .lbody{font-size:12px;}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:11px;}
  .proc{font-size:12px;}
  .proch{font-size:13px;font-weight:700;}
  .callh{font-size:13px;font-weight:700;}
  .callb{font-size:12px;}
</style>
</head>
<body>
<svg width="1300" height="900" viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L4,7 L8,0 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1300" height="900" fill="#ffffff"/>
  <text x="50" y="42" class="title">Q4 · 一個 GraphQL 請求的分層解剖</text>
  <text x="50" y="66" class="subtitle">OSI 七層　×　Chromium / Linux 底層　·　GraphQL 與 401 在 L7、封鎖的鑰匙在 L3</text>
  <line x1="50" y1="80" x2="1250" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="60" y="108" class="colh">CHROMIUM / LINUX 底層</text>
  <text x="320" y="108" class="colh">OSI 七層　←　請求往下走</text>
  <text x="900" y="108" class="colh">實測發現對應</text>

  <!-- descent arrows on far left -->
  <path d="M40,124 L40,752" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <path d="M40,290 l0,10" stroke="#64748b" stroke-width="2" marker-end="url(#dn)"/>
  <path d="M40,470 l0,10" stroke="#64748b" stroke-width="2" marker-end="url(#dn)"/>
  <path d="M40,650 l0,10" stroke="#64748b" stroke-width="2" marker-end="url(#dn)"/>

  <!-- ===== Chromium/Linux left blocks ===== -->
  <g>
    <rect x="60" y="124" width="230" height="80" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
    <text x="74" y="147" class="proch" fill="#991b1b">① Renderer 行程</text>
    <text x="74" y="168" class="proc" fill="#7f1d1d">Blink + V8 跑 JS</text>
    <text x="74" y="186" class="mono" fill="#7f1d1d">fetch("/graphql/query")</text>
    <text x="74" y="201" class="proc" fill="#b91c1c">sandbox：碰不到 socket</text>
  </g>
  <g>
    <rect x="60" y="216" width="230" height="172" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
    <text x="74" y="239" class="proch" fill="#9a3412">② Network Service</text>
    <text x="74" y="260" class="proc" fill="#7c2d12">經 Mojo IPC 送出沙盒</text>
    <text x="74" y="279" class="mono" fill="#7c2d12">net:: 網路堆疊</text>
    <text x="74" y="298" class="proc" fill="#7c2d12">URLLoader · HTTP cache</text>
    <text x="74" y="317" class="proc" fill="#7c2d12">Cookie store（匿名=空）</text>
    <text x="74" y="336" class="proc" fill="#7c2d12">DNS · socket pool</text>
    <text x="74" y="355" class="mono" fill="#7c2d12">BoringSSL TLS 握手</text>
    <text x="74" y="374" class="proc" fill="#7c2d12">HTTP/2 framing</text>
  </g>
  <g>
    <rect x="60" y="400" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
    <text x="74" y="423" class="proch" fill="#166534">系統呼叫 syscall</text>
    <text x="74" y="444" class="mono" fill="#14532d">socket() connect()</text>
    <text x="74" y="462" class="mono" fill="#14532d">sendmsg() recvmsg()</text>
    <text x="74" y="478" class="proc" fill="#15803d">epoll 非同步事件</text>
  </g>
  <g>
    <rect x="60" y="492" width="230" height="80" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="74" y="515" class="proch" fill="#1e40af">③ Kernel TCP/IP</text>
    <text x="74" y="536" class="proc" fill="#1e3a8a">TCP 狀態機 · 壅塞控制</text>
    <text x="74" y="555" class="proc" fill="#1e3a8a">來源 IP 由 routing 決定</text>
    <text x="74" y="570" class="proc" fill="#1d4ed8">netfilter / iptables</text>
  </g>
  <g>
    <rect x="60" y="584" width="230" height="80" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6"/>
    <text x="74" y="607" class="proch" fill="#3730a3">④ 網卡驅動</text>
    <text x="74" y="628" class="proc" fill="#312e81">NIC driver → DMA</text>
    <text x="74" y="648" class="proc" fill="#312e81">寫入硬體佇列</text>
  </g>
  <g>
    <rect x="60" y="676" width="230" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="74" y="699" class="proch" fill="#334155">線路送出</text>
    <text x="74" y="720" class="proc" fill="#1e293b">→ 路由器 → ISP</text>
    <text x="74" y="739" class="proc" fill="#1e293b">→ Meta 伺服器</text>
  </g>

  <!-- ===== OSI layer bars ===== -->
  <!-- L7 -->
  <g>
    <rect x="320" y="124" width="560" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="338" y="152" class="lnum" fill="#991b1b">L7</text>
    <text x="338" y="172" class="lname" fill="#991b1b">應用層</text>
    <text x="400" y="147" class="lbody" fill="#7f1d1d">HTTP/2  POST /graphql/query</text>
    <text x="400" y="166" class="mono" fill="#7f1d1d">headers: x-fb-lsd · x-csrftoken · x-ig-app-id · Sec-Fetch-Mode</text>
    <text x="400" y="183" class="mono" fill="#7f1d1d">body: doc_id + variables</text>
    <text x="400" y="200" class="lbody" fill="#b91c1c">◄ GraphQL 在這　·　401 也在這層回</text>
  </g>
  <!-- L6 -->
  <g>
    <rect x="320" y="216" width="560" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="338" y="244" class="lnum" fill="#9a3412">L6</text>
    <text x="338" y="264" class="lname" fill="#9a3412">表現層</text>
    <text x="400" y="249" class="lbody" fill="#7c2d12">TLS 1.3 加密（BoringSSL）</text>
    <text x="400" y="269" class="lbody" fill="#7c2d12">Brotli 壓縮　+　UTF-8 / JSON 序列化</text>
    <text x="400" y="289" class="lbody" fill="#c2410c">◄ 27.8 KB（壓縮） ↔ 233 KB（解壓）的差距在這</text>
  </g>
  <!-- L5 -->
  <g>
    <rect x="320" y="308" width="560" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="338" y="336" class="lnum" fill="#92400e">L5</text>
    <text x="338" y="356" class="lname" fill="#92400e">會談層</text>
    <text x="400" y="343" class="lbody" fill="#78350f">TLS session 建立 / 續用（handshake、session ticket）</text>
    <text x="400" y="368" class="lbody" fill="#b45309">◄ verification 說的「TLS 握手流量」</text>
  </g>
  <!-- L4 -->
  <g>
    <rect x="320" y="400" width="560" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="338" y="428" class="lnum" fill="#166534">L4</text>
    <text x="338" y="448" class="lname" fill="#166534">傳輸層</text>
    <text x="400" y="435" class="lbody" fill="#14532d">TCP　port 443</text>
    <text x="400" y="460" class="lbody" fill="#14532d">segment · 序號 · 重傳 · 流控（HTTP/3 則為 QUIC/UDP）</text>
  </g>
  <!-- L3 highlight -->
  <g>
    <rect x="320" y="492" width="560" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="338" y="520" class="lnum" fill="#1e40af">L3</text>
    <text x="338" y="540" class="lname" fill="#1e40af">網路層</text>
    <text x="400" y="519" class="lbody" fill="#1e3a8a">IP 封包　·　來源 IP = 出口 / 代理 IP</text>
    <text x="400" y="542" class="lname" fill="#1d4ed8">★ 封鎖的判定就在這層的「來源 IP」★</text>
    <text x="400" y="563" class="lbody" fill="#1e3a8a">routing table 決定來源位址　·　掛代理＝換這個 IP</text>
  </g>
  <!-- L2 -->
  <g>
    <rect x="320" y="584" width="560" height="80" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="338" y="612" class="lnum" fill="#3730a3">L2</text>
    <text x="338" y="632" class="lname" fill="#3730a3">資料連結層</text>
    <text x="400" y="619" class="lbody" fill="#312e81">Ethernet / Wi-Fi frame</text>
    <text x="400" y="644" class="lbody" fill="#312e81">MAC 位址 · ARP · 本地網段一跳</text>
  </g>
  <!-- L1 -->
  <g>
    <rect x="320" y="676" width="560" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="338" y="704" class="lnum" fill="#334155">L1</text>
    <text x="338" y="724" class="lname" fill="#334155">實體層</text>
    <text x="400" y="712" class="lbody" fill="#1e293b">銅線 / 光纖 / 無線電上的 bit</text>
    <text x="400" y="737" class="lbody" fill="#1e293b">電壓 · 光脈衝 · 無線電波</text>
  </g>

  <!-- ===== right callouts ===== -->
  <g>
    <rect x="900" y="124" width="350" height="80" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.6"/>
    <text x="916" y="148" class="callh" fill="#991b1b">Sec-Fetch 門檻（§1）@ L7</text>
    <text x="916" y="170" class="callb" fill="#334155">缺 Sec-Fetch-Mode → 回 SHELL（0 篇）</text>
    <text x="916" y="190" class="callb" fill="#334155">補上即回貼文　·　與 TLS 指紋無關</text>
  </g>
  <path d="M880,164 L898,164" stroke="#dc2626" stroke-width="1.6" fill="none"/>
  <g>
    <rect x="900" y="248" width="350" height="72" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.6"/>
    <text x="916" y="272" class="callh" fill="#9a3412">壓縮計費（§4）@ L6</text>
    <text x="916" y="294" class="callb" fill="#334155">線上傳壓縮後 ≈ 32 KB/次</text>
    <text x="916" y="313" class="callb" fill="#334155">代理按壓縮後流量計費 → 成本基準</text>
  </g>
  <path d="M880,284 L898,284" stroke="#ea580c" stroke-width="1.6" fill="none"/>
  <g>
    <rect x="900" y="476" width="350" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="916" y="500" class="callh" fill="#1e40af">封鎖鑰匙（§7）@ L3　← 核心</text>
    <text x="916" y="522" class="callb" fill="#334155">單 IP ~5 req/s、累積 80–100 次 → 401</text>
    <text x="916" y="542" class="callb" fill="#334155">換新 token（L7）無效</text>
    <text x="916" y="562" class="callb" fill="#334155">換 IP（L3）才解 → 5 分鐘未解封</text>
    <text x="916" y="582" class="callb" fill="#1d4ed8">∴ 成本全壓在代理 IP，不在帳號</text>
  </g>
  <path d="M880,532 L898,532" stroke="#2563eb" stroke-width="2.2" fill="none"/>

  <line x1="50" y1="786" x2="1250" y2="786" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="812" class="subtitle">一句話：GraphQL、token、401 都在 L7；封鎖的鑰匙在 L3 的來源 IP。兩者不同層，這就是整題成本壓在代理 IP 的根本原因。</text>
  <text x="50" y="836" class="subtitle" fill="#94a3b8">註：OSI 為參考模型，TLS 實務上跨 L5–L6，與 TCP/IP 堆疊並非一一對應。</text>
</svg>
</body>
</html>
