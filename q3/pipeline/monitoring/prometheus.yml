global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pushgateway        # crawler 每 15 秒把指標推到這裡
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: q3_search          # 查詢 API 自己的 /metrics
    static_configs:
      - targets: ["search:8300"]
